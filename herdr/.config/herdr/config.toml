onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
sidebar_width = 32
sidebar_max_width = 52
agent_panel_sort = "spaces"
status_indicators = "symbols"

[ui.sidebar.agents]
row_gap = 1
rows = [
  [{ token = "workspace", bold = true }],
  ["state_icon", "agent"],
  ["tab"],
  [{ token = "terminal_title_stripped", bold = true, dim = false }],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = true
